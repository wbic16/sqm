[package]
name = "sqm"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
libphext = "0.3.0"
rmcp = { version = "0.1.5", features = ["server", "transport-io"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
